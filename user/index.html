<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/pages/profile.css">
    <style>
        /* General Modal Styles (reused from other pages) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 10001; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.7); /* Black w/ opacity */
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #0d283c;
            border: 2px solid #01edf0;
            box-shadow: 0 0 15px #01edf0;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            position: relative;
            text-align: center;
            color: #fff;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #01edf0;
        }

        .modal-content p {
            color: #fff;
            margin-bottom: 15px;
        }

        .modal .close-button {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal .close-button:hover,
        .modal .close-button:focus {
            color: #01edf0;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .modal-actions .btn {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .modal-actions .cancel-btn {
            background-color: transparent;
            border: 2px solid #ff3333;
            color: #ff3333;
            box-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        .modal-actions .cancel-btn:hover {
            background-color: rgba(255, 51, 51, 0.2);
            box-shadow: 0 0 10px #ff3333;
        }

        .modal-actions .username-btn { /* Reusing username-btn style for proceed */
            background-color: transparent;
            border: 2px solid #01edf0;
            color: #01edf0;
            box-shadow: 0 0 5px rgba(1, 237, 240, 0.5);
        }

        .modal-actions .username-btn:hover {
            background-color: rgba(1, 237, 240, 0.2);
            box-shadow: 0 0 10px #01edf0;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-arrow">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <main class="profile-container">

        <div class="profile-header">
            <img id="pfp-display" 
                 src="../assets/pfp/default-pfp.png" 
                 alt="Profile Picture" 
                 class="pfp-image"
                 onerror="this.src='../assets/pfp/default-pfp.png'">
            <h1 id="user-display-name">Loading...</h1>
            <div id="friend-status-container"></div>
            <p id="user-join-date">Loading...</p>
            <p id="profile-views">Loading...</p>
        </div>
        <div id="profile-error-message" class="error-message hidden"></div>
        <div class="profile-body">
            <section class="profile-section" id="lastfm-now-playing-section" style="display: none;">
                <h2>Currently Listening</h2>
                <div id="lastfm-now-playing">
                    <img id="lastfm-album-art" src="" alt="Album Art" style="display: none;">
                    <p id="lastfm-track-info"></p>
                    <a id="lastfm-track-link" href="#" target="_blank" rel="noopener noreferrer" style="display: none;">View on Last.fm</a>
                </div>
            </section>
            <section class="profile-section">
                <h2>About Me</h2>
                <p id="user-bio">Loading...</p>
            </section>
            <section class="profile-section">
                <h2>Socials</h2>
                <div id="user-socials" class="social-links-container"></div>
            </section>
        </div>
    </main>

    <script type="module" src="../js/pages/user-profile.js"></script>

    <!-- External Link Warning Modal -->
    <div id="external-link-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>External Link Warning</h2>
            <p>You are about to leave YikeGame and navigate to an external website:</p>
            <p><strong id="external-link-url"></strong></p>
            <p>YikeGame is not responsible for the content or privacy practices of external sites.</p>
            <div class="modal-actions">
                <button id="cancel-external-link" class="btn cancel-btn">Cancel</button>
                <button id="proceed-external-link" class="btn username-btn">Proceed</button>
            </div>
        </div>
    </div>
</body>
</html>
